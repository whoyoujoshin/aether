<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aether Pay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* The block explorer's identity (explorer-web/src/theme.css): warm
       ink and bone, signal red for the brand, green only for success. */
    :root {
      --ink: #0a0908; --panel: #12100e; --border: #26221e; --rule: #1c1916;
      --hover: #1a1714; --cell: #221e1a; --icon: #4a443d;
      --bone: #f3efe6; --text-2: #d8d1c5; --muted: #9a9186; --faint: #6b645b;
      --red: #c0503a; --red-12: rgba(192,80,58,.12); --red-35: rgba(192,80,58,.35);
      --green: #16c784; --green-10: rgba(22,199,132,.1);
      --danger: #f0506e; --danger-12: rgba(240,80,110,.12);
      --glow: radial-gradient(100% 80% at 100% 0%, rgba(192,80,58,.16), rgba(192,80,58,0) 60%), var(--panel);
      --sans: "Space Grotesk", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body, #root { min-height: 100%; }
    body { margin: 0; background: var(--ink); color: var(--bone); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    a { color: var(--red); text-decoration: none; }
    .mono { font-family: var(--mono); }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }

    .app { display: flex; min-height: 100vh; }
    .side { width: 236px; flex-shrink: 0; border-right: 1px solid var(--rule); padding: 18px 12px 14px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 22px; }
    .brand img { width: 32px; height: 32px; }
    .brand b { display: block; font-size: 16px; font-weight: 700; letter-spacing: .01em; }
    .brand small { display: block; font: 600 9.5px/1.4 var(--mono); letter-spacing: .16em; color: var(--red); }
    .nav { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px; border: 0; border-left: 2px solid transparent; border-radius: 0 9px 9px 0; background: none; color: var(--muted); font-weight: 500; font-size: 13.5px; text-align: left; }
    .nav:hover { background: var(--hover); color: var(--text-2); }
    .nav.on { background: var(--hover); color: var(--bone); border-left-color: var(--red); font-weight: 600; }
    .nav .g { width: 16px; text-align: center; font-family: var(--mono); font-size: 12px; color: var(--faint); }
    .nav.on .g { color: var(--red); }
    .pq { margin-top: auto; border: 1px solid var(--border); border-radius: 12px; padding: 12px 13px; font-size: 11.5px; line-height: 1.5; color: var(--muted); background: var(--panel); }
    .pq .t { font: 600 10px/1 var(--mono); letter-spacing: .12em; color: var(--green); margin-bottom: 7px; display: flex; align-items: center; gap: 7px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; flex-shrink: 0; }
    .dot.bad { background: var(--danger); }
    .dot.wait { background: var(--faint); }
    .dot.upd { background: var(--red); margin-left: auto; }
    .bar { height: 6px; border-radius: 3px; background: var(--cell); overflow: hidden; margin-top: 4px; }
    .bar i { display: block; height: 100%; background: var(--red); transition: width .3s; }

    .acct { position: relative; margin-top: 12px; }
    .acct > button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 1px solid transparent; border-radius: 11px; background: none; text-align: left; }
    .acct > button:hover, .acct > button.open { background: var(--hover); border-color: var(--border); }
    .av { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--cell); border: 1px solid var(--border); font: 600 11.5px/1 var(--mono); color: var(--text-2); text-transform: lowercase; }
    .av.agent { color: var(--red); border-color: var(--red-35); }
    .av.in { color: var(--green); border-color: rgba(22,199,132,.3); }
    .av.bad { color: var(--danger); border-color: rgba(240,80,110,.3); }
    .acct .nm { font-weight: 600; font-size: 13px; }
    .acct .ad { font: 10.5px/1.3 var(--mono); color: var(--faint); }
    .menu { position: absolute; left: 0; right: -80px; bottom: calc(100% + 6px); background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 8px; box-shadow: 0 16px 40px rgba(0,0,0,.55); z-index: 20; }
    .menu h6 { margin: 6px 8px 4px; font: 600 9.5px/1 var(--mono); letter-spacing: .14em; color: var(--faint); }
    .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: none; text-align: left; }
    .menu button:hover { background: var(--hover); }
    .menu button.sel { background: var(--hover); }
    .menu .none { padding: 6px 8px 8px; font-size: 11.5px; color: var(--faint); }
    .menu .add { color: var(--red); font-weight: 600; font-size: 12.5px; border-top: 1px solid var(--rule); border-radius: 0 0 8px 8px; margin-top: 4px; padding-top: 10px; }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .top { height: 58px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 28px; border-bottom: 1px solid var(--rule); }
    .top h1 { margin: 0; font-size: 15px; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 10px; font: 11.5px/1 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; }
    .status .sep { color: var(--icon); }
    .banner { margin: 18px 28px 0; padding: 12px 14px; border-radius: 10px; font-size: 12.5px; background: var(--danger-12); border: 1px solid rgba(240,80,110,.3); color: #ff9aac; }
    .content { padding: 22px 28px 40px; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; max-width: 1220px; align-items: start; }
    .content.single { grid-template-columns: minmax(0, 720px); }
    .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; }
    .card.glow { background: var(--glow); }
    .card h2 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
    .card h3 { margin: 0; font-size: 13.5px; font-weight: 600; }
    .kicker { font: 600 10.5px/1 var(--mono); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
    .headrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .bal { display: flex; justify-content: space-between; gap: 16px; }
    .big { font: 600 50px/1.05 var(--mono); letter-spacing: -.02em; margin-top: 10px; }
    .big .unit { font-size: 19px; color: var(--red); margin-left: 8px; letter-spacing: .02em; }
    .sub { font: 11.5px/1.5 var(--mono); color: var(--faint); margin-top: 8px; }
    .actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }

    .btn { flex: 1; min-width: 118px; padding: 13px 18px; border-radius: 999px; border: 1px solid var(--border); background: var(--cell); color: var(--bone); font-weight: 600; font-size: 13px; }
    .btn:hover:not(:disabled) { border-color: #3a342d; background: #29241f; }
    .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
    .btn.primary:hover:not(:disabled) { background: #d05a43; border-color: #d05a43; }
    .btn:disabled { opacity: .45; }
    .btn.sm { flex: 0 0 auto; min-width: 0; padding: 7px 13px; font: 600 10.5px/1 var(--mono); letter-spacing: .08em; }
    .btn.ghost { background: none; }
    .btn.danger { background: none; border-color: rgba(240,80,110,.4); color: #ff9aac; }
    .link { background: none; border: 0; padding: 0; color: var(--red); font: 600 10.5px/1 var(--mono); letter-spacing: .1em; }

    .feedhead { display: flex; align-items: baseline; gap: 12px; margin: 6px 2px 0; }
    .feedhead h3 { margin: 0; font-size: 14px; font-weight: 600; }
    .feedhead span { font: 10px/1 var(--mono); letter-spacing: .1em; color: var(--faint); text-transform: uppercase; }
    .tx { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 14px; padding: 16px 18px; }
    .tx .who { font-size: 13.5px; }
    .tx .who b { font-weight: 600; }
    .tx .who .v { color: var(--faint); margin: 0 6px; font-size: 12.5px; }
    .tx .memo { margin-top: 6px; color: var(--text-2); font-size: 13.5px; overflow-wrap: anywhere; }
    .tx .memo.none { color: var(--faint); font-style: italic; font-size: 12.5px; }
    .tx .amt { font: 600 13.5px/1.2 var(--mono); text-align: right; white-space: nowrap; }
    .tx .amt.in { color: var(--green); }
    .tx .amt.fail { color: var(--danger); }
    .tx .meta { font: 10.5px/1 var(--mono); color: var(--faint); letter-spacing: .06em; text-align: right; margin-top: 14px; white-space: nowrap; }
    .tx .meta a { color: var(--muted); }
    .tx .meta a:hover { color: var(--red); }
    .tag { display: inline-block; font: 600 9.5px/1 var(--mono); letter-spacing: .1em; padding: 4px 7px; border-radius: 6px; background: var(--red-12); color: var(--red); vertical-align: 2px; margin-left: 8px; }
    .tag.ok { background: var(--green-10); color: var(--green); }
    .tag.bad { background: var(--danger-12); color: var(--danger); }

    .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
    .row + .row { border-top: 1px solid var(--rule); }
    .row .grow { flex: 1; min-width: 0; }
    .row .nm { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
    .row .ad { font: 10.5px/1.4 var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card.empty { padding: 18px 22px; }
    .facts dl { display: grid; grid-template-columns: 58px 1fr; gap: 12px 14px; margin: 0; }
    .facts dt { font: 600 10.5px/1.6 var(--mono); color: var(--red); letter-spacing: .06em; }
    .facts dd { margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--muted); }
    .kv { display: flex; justify-content: space-between; gap: 10px; font: 12px/1 var(--mono); padding: 7px 0; }
    .kv span:first-child { color: var(--faint); letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }
    .kv .red { color: var(--red); }

    label.f { display: block; font: 600 10.5px/1 var(--mono); letter-spacing: .1em; color: var(--muted); margin: 16px 0 7px; text-transform: uppercase; }
    .field { width: 100%; padding: 12px 13px; background: var(--ink); border: 1px solid var(--border); border-radius: 10px; font: 13px/1.4 var(--mono); outline: none; }
    .field:focus { border-color: var(--red-35); }
    textarea.field { resize: vertical; }
    .hint { font: 11px/1.4 var(--mono); margin-top: 6px; color: var(--faint); min-height: 15px; }
    .hint.ok { color: var(--green); }
    .hint.bad { color: var(--danger); }
    .note { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
    .warn { display: flex; gap: 10px; padding: 13px 14px; border-radius: 10px; background: var(--red-12); border: 1px solid var(--red-35); color: #e9a594; font-size: 12.5px; line-height: 1.55; }
    .addr { font: 13px/1.5 var(--mono); padding: 16px; background: var(--ink); border: 1px solid var(--border); border-radius: 10px; overflow-wrap: anywhere; }
    .words { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
    .words div { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--ink); font: 12.5px/1 var(--mono); }
    .words i { color: var(--faint); font-style: normal; margin-right: 6px; font-size: 10.5px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
    .tabs button { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: none; color: var(--muted); font-weight: 600; font-size: 12.5px; }
    .tabs button.on { background: var(--cell); color: var(--bone); border-color: #3a342d; }
    .setup { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .setup .card { width: min(560px, 100%); }
    .empty { color: var(--faint); font-size: 12.5px; padding: 6px 0; }
    .check { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--text-2); margin: 14px 0 8px; }
    @media (max-width: 1080px) { .content { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Shipped with the app (see vendor/README.md), not fetched from a CDN:
       this page drives a wallet, so it runs no code from third parties. -->
  <script src="vendor/react-18.2.0.production.min.js"></script>
  <script src="vendor/react-dom-18.2.0.production.min.js"></script>
  <script src="vendor/babel-standalone-7.23.5.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback, useRef } = React;

    const API = "http://localhost:8090";
    const EXPLORER = "https://explorer.157-245-252-221.sslip.io";
    const FAUCET = "https://faucet.157-245-252-221.sslip.io/request";
    // walletapi refuses requests without the secret the desktop app (or
    // walletapi itself, when run by hand) put in this page's URL.
    const TOKEN = new URLSearchParams(location.search).get("token") || "";
    const ADDR_RE = /^aether1[a-z0-9]{38,90}$/;

    async function api(path, body) {
      const opts = { headers: { "X-Wallet-Token": TOKEN } };
      if (body !== undefined) {
        opts.method = "POST";
        opts.headers["Content-Type"] = "application/json";
        opts.body = JSON.stringify(body);
      }
      let res;
      try {
        res = await fetch(API + path, opts);
      } catch (e) {
        throw new Error("The wallet's local service isn't answering. Restart Aether Pay.");
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.message || "request failed");
      return data;
    }

    // Amounts are whole uaeth strings; BigInt keeps every digit.
    function uaethOf(s) {
      const m = /^(\d+)/.exec(String(s || "0"));
      return m ? BigInt(m[1]) : 0n;
    }
    function aeth(u, dp = 4) {
      return units(typeof u === "bigint" ? u : uaethOf(u), 6, dp);
    }
    // Base units as a decimal amount of an asset with `decimals`, at least dp places.
    function units(u, decimals, dp = 2) {
      const one = 10n ** BigInt(decimals);
      const whole = u / one;
      let frac = decimals ? (u % one).toString().padStart(decimals, "0").replace(/0+$/, "") : "";
      if (frac.length < dp) frac = frac.padEnd(dp, "0");
      return whole.toLocaleString("en-US") + (frac ? "." + frac : "");
    }
    // A coin as the chain writes it ("1500000uaeth", "5000000ibc/…"); the first, if several.
    function coinOf(s) {
      const m = /^(\d+)([a-zA-Z][a-zA-Z0-9/:._-]*)?/.exec(String(s || "0"));
      return m ? { amount: BigInt(m[1]), denom: m[2] || "uaeth" } : { amount: 0n, denom: "uaeth" };
    }
    const AETH_ASSET = { symbol: "AETH", denom: "uaeth", baseUnit: "uaeth", decimals: 6, origin: "Aether" };
    function shortDenom(d) { return d.startsWith("ibc/") ? d.slice(0, 10) + "…" : d; }
    // How to show amount of denom: in a known asset's own unit, or as a bare
    // number of an unrecognized token (never as AETH).
    function money(amount, denom, assets, dp = 2) {
      const a = (assets || [AETH_ASSET]).find((x) => x.denom === denom);
      if (a) return { text: units(amount, a.decimals, dp), unit: a.symbol, title: a.origin + " · " + a.denom };
      return { text: amount.toLocaleString("en-US"), unit: shortDenom(denom), title: denom + " · a token this wallet doesn't recognize" };
    }
    // "USDC (Noble)" from its origin "Noble over transfer/channel-3".
    function assetLabel(a) { return a.denom === "uaeth" ? a.symbol : a.symbol + " (" + a.origin.split(" ")[0] + ")"; }
    function int(n) { return Number(n).toLocaleString("en-US"); }
    function short(a) { return a ? a.slice(0, 12) + "…" + a.slice(-6) : ""; }
    function initials(name) { return (name || "?").replace(/[^A-Za-z0-9]/g, "").slice(0, 2) || "?"; }
    function ago(ts) {
      const t = Date.parse(ts);
      if (!t) return "";
      const s = Math.max(0, (Date.now() - t) / 1000);
      if (s < 90) return "just now";
      if (s < 3600) return Math.round(s / 60) + "m ago";
      if (s < 86400) return Math.round(s / 3600) + "h ago";
      if (s < 172800) return "yesterday";
      return Math.round(s / 86400) + " days ago";
    }
    function when(ts) {
      if (!ts) return "no expiry";
      const d = new Date(ts);
      return (d < new Date() ? "expired " : "") + d.toLocaleString();
    }
    function coinsU(coins) {
      const c = (coins || []).find((x) => x.denom === "uaeth");
      return c ? c.amount : "0";
    }
    const MODULES = { pow: "Mining reward", treasury: "Treasury", fee_collector: "Fees", governance: "Governance" };
    // Transactions that move none of this account's money, by message.
    const ACTIONS = {
      MsgGrant: "Gave an agent an allowance",
      MsgRevoke: "Revoked an agent's allowance",
      MsgGrantAllowance: "Offered to pay an agent's fees",
      MsgRevokeAllowance: "Stopped paying an agent's fees",
      MsgRegisterValidatorPubkey: "Registered a consensus key",
      MsgSubmitPoW: "Submitted mining work",
      MsgVote: "Voted on a proposal",
      MsgSubmitProposal: "Submitted a proposal",
    };

    const NAV = [
      ["home", "Home", "◎"],
      ["send", "Send", "↗"],
      ["receive", "Receive", "↙"],
      ["activity", "Activity", "≡"],
      ["agents", "Agents", "◇"],
      ["faucet", "Faucet", "◈"],
      ["buy", "Buy AETH", "$"],
      ["swap", "Swap", "⇄"],
      ["settings", "Settings", "⚙"],
    ];
    // Set by the desktop app's preload script; absent in a plain browser.
    const shellApp = window.aetherApp || null;
    function mb(n) { return (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + " MB"; }

    function App() {
      const [accounts, setAccounts] = useState(null); // this wallet's own keys
      const [adding, setAdding] = useState(false);
      const [view, setView] = useState(null); // {kind:"own", name, address} | {kind:"agent", address, perm}
      const [screen, setScreen] = useState("home");
      const [balance, setBalance] = useState(null);
      const [holdings, setHoldings] = useState(null); // {assets: [{symbol, denom, decimals, origin, amount}], others: [{denom, amount}]}
      const [activity, setActivity] = useState(null);
      const [perms, setPerms] = useState(null);
      const [chain, setChain] = useState(null);
      const [chainErr, setChainErr] = useState("");
      const [err, setErr] = useState("");
      const [menu, setMenu] = useState(false);
      const [sendTo, setSendTo] = useState("");
      const [update, setUpdate] = useState(null);
      useEffect(() => {
        if (!shellApp) return;
        shellApp.updateState().then(setUpdate);
        return shellApp.onUpdateState(setUpdate);
      }, []);
      const updateFlag = update && (update.state === "available" || update.state === "ready");

      const loadAccounts = useCallback(async () => {
        try {
          const list = (await api("/api/accounts")).map((a) => ({ name: a.Name || a.name, address: a.Address || a.address }));
          setAccounts(list);
          return list;
        } catch (e) {
          setErr(e.message);
          setAccounts([]);
          return [];
        }
      }, []);
      useEffect(() => { loadAccounts(); }, []);
      useEffect(() => {
        if (accounts && accounts.length && !view) setView({ kind: "own", name: accounts[0].name, address: accounts[0].address });
      }, [accounts]);

      const owner = view && view.kind === "own" ? view : (accounts && accounts.length ? { kind: "own", ...accounts[0] } : null);
      const address = view ? view.address : "";

      const loadChain = useCallback(async () => {
        try { setChain(await api("/api/chain")); setChainErr(""); }
        catch (e) { setChainErr(e.message); }
      }, []);
      useEffect(() => { loadChain(); const t = setInterval(loadChain, 15000); return () => clearInterval(t); }, []);

      const loadBalance = useCallback(async () => {
        if (!address) return;
        try {
          const d = await api("/api/balance?address=" + encodeURIComponent(address));
          setBalance(d.balance); setHoldings({ assets: d.assets || [{ ...AETH_ASSET, amount: d.balance }], others: d.others || [] }); setErr("");
        } catch (e) { setErr(e.message); }
      }, [address]);
      const loadActivity = useCallback(async () => {
        if (!address) return;
        try { setActivity(await api("/api/history?address=" + encodeURIComponent(address))); }
        catch (e) { setActivity([]); }
      }, [address]);
      const loadPerms = useCallback(async () => {
        if (!owner) return;
        try { setPerms(await api("/api/grants?name=" + encodeURIComponent(owner.name))); }
        catch (e) { setPerms({ given: [], received: [], error: e.message }); }
      }, [owner && owner.name]);

      useEffect(() => {
        setBalance(null); setHoldings(null); setActivity(null);
        loadBalance(); loadActivity();
        const t = setInterval(() => { loadBalance(); loadActivity(); }, 20000);
        return () => clearInterval(t);
      }, [address]);
      useEffect(() => { loadPerms(); }, [owner && owner.name]);

      const refresh = () => { loadBalance(); loadActivity(); loadChain(); };

      if (accounts === null) return <div className="setup faint mono">Opening wallet…</div>;
      if (!accounts.length || adding) {
        return <Setup canCancel={accounts.length > 0} onCancel={() => setAdding(false)} onDone={async (acc) => {
          await loadAccounts();
          setAdding(false);
          setView({ kind: "own", name: acc.name, address: acc.address });
          setScreen("home");
        }} />;
      }

      const agents = (perms && perms.given) || [];
      const isAgent = view && view.kind === "agent";
      const title = { home: "Home", send: "Send", receive: "Receive", activity: "Activity", agents: "Agents", faucet: "Faucet", buy: "Buy AETH", swap: "Swap", settings: "Settings" }[screen];
      const go = (s) => { setScreen(s); setMenu(false); };
      const pay = (addr) => { setSendTo(addr); go("send"); };

      return (
        <div className="app" onClick={() => menu && setMenu(false)}>
          <aside className="side">
            <div className="brand">
              <img src="aether-mark.svg" alt="" />
              <div><b>Aether Pay</b><small>TESTNET</small></div>
            </div>
            {NAV.map(([k, label, g]) => (
              <button key={k} className={"nav" + (screen === k ? " on" : "")} onClick={() => go(k)}>
                <span className="g">{g}</span>{label}
                {k === "settings" && updateFlag && <span className="dot upd" title="Update available" />}
              </button>
            ))}
            <div className="pq">
              <div className="t"><span className="dot" />ML-DSA-44 ACTIVE</div>
              Every transaction from this wallet is signed with a NIST FIPS 204 post-quantum key. Aether has no classical fallback.
            </div>
            <div className="acct" onClick={(e) => e.stopPropagation()}>
              {menu && (
                <div className="menu">
                  <h6>YOUR WALLET</h6>
                  {accounts.map((a) => (
                    <button key={a.name} className={view && view.kind === "own" && view.name === a.name ? "sel" : ""}
                      onClick={() => { setView({ kind: "own", ...a }); setMenu(false); }}>
                      <span className="av">{initials(a.name)}</span>
                      <span><div className="nm">{a.name}</div><div className="ad">{short(a.address)}</div></span>
                    </button>
                  ))}
                  <h6 style={{ marginTop: 12 }}>AGENTS YOU'VE FUNDED</h6>
                  {agents.length === 0 && <div className="none">None yet. Give one an allowance under Agents.</div>}
                  {agents.map((p) => (
                    <button key={p.account} className={isAgent && view.address === p.account ? "sel" : ""}
                      onClick={() => { setView({ kind: "agent", address: p.account, perm: p }); setMenu(false); go("home"); }}>
                      <span className="av agent">ag</span>
                      <span><div className="nm">Agent · read-only</div><div className="ad">{short(p.account)}</div></span>
                    </button>
                  ))}
                  <button className="add" onClick={() => { setMenu(false); setAdding(true); }}>+ Add an account</button>
                </div>
              )}
              <button className={menu ? "open" : ""} onClick={() => setMenu(!menu)}>
                <span className={"av" + (isAgent ? " agent" : "")}>{isAgent ? "ag" : initials(view && view.name)}</span>
                <span style={{ minWidth: 0 }}>
                  <div className="nm">{isAgent ? "Agent" : view && view.name}{isAgent && <span className="tag">VIEW</span>}</div>
                  <div className="ad">{short(address)}</div>
                </span>
                <span className="faint mono" style={{ marginLeft: "auto" }}>⌃</span>
              </button>
            </div>
          </aside>

          <main className="main">
            <div className="top">
              <h1>{title}</h1>
              <ChainStatus chain={chain} error={chainErr} />
            </div>
            {err && <div className="banner">{err}</div>}

            {screen === "home" && (
              <div className="content">
                <div className="col">
                  <div className="card glow">
                    <div className="bal">
                      <div style={{ minWidth: 0 }}>
                        <div className="kicker">{isAgent ? "Agent balance" : "Spendable balance"}{isAgent && <span className="tag">READ-ONLY</span>}</div>
                        <div className="big">{balance === null ? "—" : aeth(balance)}<span className="unit">AETH</span></div>
                        <div className="sub">{short(address)}{isAgent && view.perm.send && (" · may still spend " + (view.perm.send.unlimited ? "without limit" : aeth(coinsU(view.perm.send.spendLimit)) + " AETH of yours") + (view.perm.send.expiration ? " · until " + new Date(view.perm.send.expiration).toLocaleString() : ""))}</div>
                      </div>
                      <div style={{ textAlign: "right", flexShrink: 0 }}>
                        <div className="kicker">{balance === null ? "" : int(balance) + " uaeth"}</div>
                        <button className="btn sm ghost" style={{ marginTop: 12 }} onClick={refresh}>RE-QUERY</button>
                      </div>
                    </div>
                    {holdings && (holdings.assets.length > 1 || holdings.others.length > 0) && (
                      <div style={{ marginTop: 14 }}>
                        {holdings.assets.slice(1).map((a) => (
                          <div className="kv" key={a.denom} title={a.origin + " · " + a.denom}><span>{assetLabel(a)}</span><span className="mono">{units(BigInt(a.amount || "0"), a.decimals, 2)} {a.symbol}</span></div>
                        ))}
                        {holdings.others.map((c) => (
                          <div className="kv" key={c.denom} title={c.denom + " · not recognized: it may look like an asset above but arrived another way"}><span className="faint">{shortDenom(c.denom)} · not recognized</span><span className="mono">{BigInt(c.amount).toLocaleString("en-US")}</span></div>
                        ))}
                      </div>
                    )}
                    <div className="actions">
                      {isAgent ? (
                        <>
                          <button className="btn primary" onClick={() => go("agents")}>Manage allowance</button>
                          <button className="btn" onClick={() => go("receive")}>Fund this agent</button>
                        </>
                      ) : (
                        <>
                          <button className="btn primary" onClick={() => go("send")}>Send</button>
                          <button className="btn" onClick={() => go("receive")}>Receive</button>
                          <button className="btn" onClick={() => go("agents")}>Agents</button>
                          <button className="btn" onClick={() => go("faucet")}>Get testnet AETH</button>
                        </>
                      )}
                    </div>
                  </div>
                  <div className="feedhead"><h3>Recent activity</h3><span>memos are public on-chain, and written by the sender</span></div>
                  <Feed txs={activity} limit={6} me={isAgent ? "this agent" : "you"} assets={holdings && holdings.assets} />
                </div>
                <div className="col">
                  {!isAgent && <Recipients txs={activity} onPay={pay} />}
                  <div className="card facts">
                    <h3 style={{ marginBottom: 14 }}>Why this wallet is different</h3>
                    <dl>
                      <dt>PQ-SIG</dt><dd>ML-DSA-44 (Dilithium2), enforced by the chain for every account transaction since genesis. A quantum computer can't forge your signature.</dd>
                      <dt>POW</dt><dd>Validators earn their seat with real Scrypt mining work, never by stake. Nobody bought their way into securing your payment.</dd>
                      <dt>1-KEY</dt><dd>Post-quantum keys have no HD derivation yet: one recovery phrase backs up exactly one account.</dd>
                    </dl>
                  </div>
                  <ChainPanel chain={chain} />
                </div>
              </div>
            )}

            {screen === "send" && (
              <div className="content single">
                {isAgent ? <div className="card"><h2>Send</h2><p className="note">Agents sign their own payments. Switch to your wallet in the account menu to send from it.</p></div>
                  : <Send owner={owner} holdings={holdings} to={sendTo} setTo={setSendTo} onSent={() => setTimeout(refresh, 4000)} />}
              </div>
            )}
            {screen === "receive" && (
              <div className="content single"><Receive address={address} label={isAgent ? "This agent's address" : "Your address"} /></div>
            )}
            {screen === "activity" && (
              <div className="content single"><div className="col"><Feed txs={activity} me={isAgent ? "this agent" : "you"} /></div></div>
            )}
            {screen === "agents" && (
              <div className="content single"><Agents owner={owner} perms={perms} reload={loadPerms} onView={(p) => { setView({ kind: "agent", address: p.account, perm: p }); go("home"); }} /></div>
            )}
            {screen === "faucet" && (
              <div className="content single"><Faucet address={address} onFunded={() => setTimeout(refresh, 5000)} /></div>
            )}
            {screen === "settings" && (
              <div className="content single"><Settings update={update} /></div>
            )}
            {(screen === "buy" || screen === "swap") && (
              <div className="content single">
                <div className="card">
                  <h2>{screen === "buy" ? "Buy AETH" : "Swap into AETH"}</h2>
                  <div className="warn"><span>⚠</span><div>
                    {screen === "buy"
                      ? "Not built yet. Buying with money needs a payment processor, which Aether doesn't have. On testnet, use the faucet."
                      : "Not built yet. Aether's IBC is live, but it has no connection to a chain with a DEX yet, so there's nothing to swap through."}
                  </div></div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    function ChainStatus({ chain, error }) {
      const [now, setNow] = useState(Date.now());
      useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
      if (!chain) return <div className="status"><span className={"dot " + (error ? "bad" : "wait")} />{error ? "node unreachable" : "connecting…"}</div>;
      let next = "";
      if (chain.avgBlockSeconds > 0) {
        const due = Date.parse(chain.blockTime) + chain.avgBlockSeconds * 1000 - now;
        next = due > 0 ? "~" + Math.ceil(due / 1000) + "s" : "any moment";
      }
      return (
        <div className="status" title={error || ""}>
          <span className={"dot" + (error ? " bad" : "")} />{chain.chainId}
          <span className="sep">/</span>height {int(chain.height)}
          {next && <><span className="sep">/</span>next block {next}</>}
          <span className="sep">/</span>epoch {int(chain.epoch)}
        </div>
      );
    }

    function ChainPanel({ chain }) {
      return (
        <div className="card">
          <h3 style={{ marginBottom: 10 }}>Chain</h3>
          {!chain ? <div className="empty">Waiting for the node…</div> : (
            <>
              <div className="kv"><span>Difficulty</span><span>{int(chain.difficulty)}</span></div>
              <div className="kv"><span>Block reward</span><span className="red">{aeth(chain.blockRewardUaeth, 2)} AETH</span></div>
              <div className="kv"><span>Validators</span><span>{chain.activeValidators} / K={chain.topKSize}</span></div>
              <div className="kv"><span>Next selection</span><span>height {int(chain.selectionHeight)}</span></div>
              <div className="kv"><span>Treasury</span><span>{aeth(chain.treasuryUaeth, 2)} AETH</span></div>
              <div className="kv"><span>Avg block</span><span>{chain.avgBlockSeconds ? chain.avgBlockSeconds.toFixed(1) + "s" : "—"}</span></div>
            </>
          )}
        </div>
      );
    }

    function Feed({ txs, limit, me, assets }) {
      if (txs === null) return <div className="card empty">Loading real chain data…</div>;
      const list = limit ? txs.slice(0, limit) : txs;
      if (!list.length) return <div className="card empty">No transactions yet.</div>;
      return list.map((t) => <TxCard key={t.Hash} t={t} me={me} assets={assets} />);
    }

    function TxCard({ t, me, assets }) {
      const sent = t.Direction === "sent";
      const coin = coinOf(t.Amount);
      const m = money(coin.amount, coin.denom, assets);
      const failed = t.Code !== 0;
      const other = t.CounterpartyModule ? MODULES[t.CounterpartyModule] || t.CounterpartyModule : (t.Counterparty ? short(t.Counterparty) : "someone");
      if (sent && !t.Counterparty && coin.amount === 0n) {
        return (
          <div className="card tx">
            <div className={"av" + (failed ? " bad" : "")}>✎</div>
            <div style={{ minWidth: 0 }}>
              <div className="who"><b>{ACTIONS[t.MsgType] || "Signed " + (t.MsgType || "a transaction")}</b>{failed && <span className="tag bad">FAILED</span>}</div>
              <div className={"memo" + (t.Memo ? "" : " none")}>{t.Memo || "no memo"}</div>
            </div>
            <div><div className="amt faint">no transfer</div>
              <div className="meta">{(ago(t.Timestamp) + " · ").toUpperCase()}<a href={EXPLORER + "/tx/" + t.Hash} target="_blank" rel="noreferrer">HEIGHT {int(t.Height)}</a></div></div>
          </div>
        );
      }
      return (
        <div className="card tx">
          <div className={"av" + (failed ? " bad" : sent ? "" : " in")}>{sent ? "↗" : "↙"}</div>
          <div style={{ minWidth: 0 }}>
            <div className="who">
              {sent ? <><b>{me}</b><span className="v">paid</span><b className="mono" style={{ fontSize: 12.5 }}>{other}</b></>
                : t.CounterpartyModule === "pow" ? <b>Mining reward</b>
                : <><b className="mono" style={{ fontSize: 12.5 }}>{other}</b><span className="v">paid</span><b>{me}</b></>}
              {failed && <span className="tag bad">FAILED</span>}
            </div>
            <div className={"memo" + (t.Memo ? "" : " none")}>{t.Memo || "no memo"}</div>
          </div>
          <div>
            <div className={"amt" + (failed ? " fail" : sent ? "" : " in")} title={m.title}>{(sent ? "−" : "+") + m.text} {m.unit}</div>
            <div className="meta">{(ago(t.Timestamp) + " · ").toUpperCase()}<a href={EXPLORER + "/tx/" + t.Hash} target="_blank" rel="noreferrer">HEIGHT {int(t.Height)}</a></div>
          </div>
        </div>
      );
    }

    function Recipients({ txs, onPay }) {
      const seen = new Set();
      const list = [];
      for (const t of txs || []) {
        if (t.Direction !== "sent" || t.Code !== 0 || !t.Counterparty || t.CounterpartyModule || seen.has(t.Counterparty)) continue;
        seen.add(t.Counterparty);
        list.push(t);
        if (list.length === 5) break;
      }
      return (
        <div className="card">
          <div className="headrow"><h3>Recent recipients</h3></div>
          {txs === null && <div className="empty">Loading…</div>}
          {txs && list.length === 0 && <div className="empty">People you pay show up here.</div>}
          {list.map((t) => (
            <div className="row" key={t.Counterparty}>
              <span className="av">{t.Counterparty.slice(7, 9)}</span>
              <div className="grow"><div className="nm mono" style={{ fontSize: 12 }}>{short(t.Counterparty)}</div><div className="ad">last paid {ago(t.Timestamp)}</div></div>
              <button className="link" onClick={() => onPay(t.Counterparty)}>PAY</button>
            </div>
          ))}
        </div>
      );
    }

    function Send({ owner, holdings, to, setTo, onSent }) {
      const [amt, setAmt] = useState("");
      const [denom, setDenom] = useState("uaeth");
      const [busy, setBusy] = useState(false);
      const [result, setResult] = useState(null);
      const validTo = ADDR_RE.test(to) && to !== owner.address;
      const list = holdings ? holdings.assets : null;
      const asset = (list || []).find((a) => a.denom === denom) || { ...AETH_ASSET, amount: null };
      const available = asset.amount == null ? null : BigInt(asset.amount);
      let base = 0n, amtOk = false;
      if (new RegExp("^\\d+(\\.\\d{0," + asset.decimals + "})?$").test(amt)) {
        const [w, f = ""] = amt.split(".");
        base = BigInt(w) * 10n ** BigInt(asset.decimals) + BigInt(f.padEnd(asset.decimals, "0") || "0");
        amtOk = base > 0n && available !== null && base <= available;
      }
      async function send() {
        setBusy(true);
        try {
          const d = await api("/api/send", { from: owner.name, to, amount: base.toString(), ...(denom === "uaeth" ? {} : { denom }) });
          setResult(d);
          if (d.success) onSent();
        } catch (e) { setResult({ success: false, message: e.message }); }
        setBusy(false);
      }
      if (result && result.success) {
        return (
          <div className="card">
            <h2>Sent <span className="tag ok">BROADCAST</span></h2>
            <p className="note">{units(base, asset.decimals, 2)} {asset.symbol} to <span className="mono">{short(to)}</span>. It's final once it's in a block, usually within a minute.</p>
            <div className="addr">{result.tx_hash}</div>
            <div className="actions">
              <a className="btn" style={{ textAlign: "center" }} href={EXPLORER + "/tx/" + result.tx_hash} target="_blank" rel="noreferrer">View on explorer</a>
              <button className="btn primary" onClick={() => { setResult(null); setTo(""); setAmt(""); }}>Send another</button>
            </div>
          </div>
        );
      }
      return (
        <div className="card">
          <h2>Send {asset.symbol}</h2>
          {list && list.length > 1 && (
            <div className="actions" style={{ marginTop: 0 }}>
              {list.map((a) => <button key={a.denom} className={"btn sm" + (a.denom === denom ? " primary" : "")} title={a.origin + " · " + a.denom} onClick={() => { setDenom(a.denom); setAmt(""); }}>{assetLabel(a)}</button>)}
            </div>
          )}
          <label className="f">Recipient</label>
          <input className="field" value={to} onChange={(e) => setTo(e.target.value.trim())} placeholder="aether1…" />
          <div className={"hint " + (to === "" ? "" : validTo ? "ok" : "bad")}>{to === "" ? "" : validTo ? "✓ valid aether1 address" : to === owner.address ? "✕ that's this account" : "✕ not an aether1 address"}</div>
          <label className="f">Amount</label>
          <input className="field" value={amt} onChange={(e) => setAmt(e.target.value.replace(/[^0-9.]/g, ""))} placeholder={"0.00  " + asset.symbol} />
          <div className={"hint" + (amt && !amtOk ? " bad" : "")}>available {available === null ? "—" : units(available, asset.decimals, 2)} {asset.symbol} · fee 0 · gas 400,000</div>
          {result && !result.success && <div className="banner" style={{ margin: "14px 0 0" }}>{result.message || result.error}</div>}
          <div className="actions">
            <button className="btn primary" disabled={!validTo || !amtOk || busy} onClick={send}>{busy ? "Signing with ML-DSA-44…" : "Sign & send"}</button>
          </div>
        </div>
      );
    }

    function Receive({ address, label }) {
      const [copied, setCopied] = useState(false);
      return (
        <div className="card">
          <h2>Receive</h2>
          <label className="f">{label}</label>
          <div className="addr">{address}</div>
          <p className="note">Anyone can pay this address. Payments show up in Activity once they're in a block.</p>
          <div className="actions">
            <button className="btn primary" onClick={() => { navigator.clipboard.writeText(address); setCopied(true); setTimeout(() => setCopied(false), 1600); }}>{copied ? "Copied" : "Copy address"}</button>
            <a className="btn" style={{ textAlign: "center" }} href={EXPLORER + "/address/" + address} target="_blank" rel="noreferrer">View on explorer</a>
          </div>
        </div>
      );
    }

    function Faucet({ address, onFunded }) {
      const [state, setState] = useState("idle");
      const [msg, setMsg] = useState("");
      async function request() {
        setState("sending"); setMsg("");
        try {
          const res = await fetch(FAUCET, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ address }) });
          const d = await res.json().catch(() => ({}));
          if (res.ok && d.success !== false) {
            setState("done");
            setMsg("Sent" + (d.tx_hash ? " · tx " + d.tx_hash.slice(0, 16) + "…" : "") + ". It shows up once it's in a block.");
            onFunded();
          } else { setState("idle"); setMsg(d.message || d.error || "The faucet refused (it's rate-limited per address)."); }
        } catch (e) { setState("idle"); setMsg("Couldn't reach the public faucet."); }
      }
      return (
        <div className="card">
          <h2>Testnet faucet</h2>
          <p className="note">Free testnet AETH from the public faucet, sent to <span className="mono">{short(address)}</span>. It's rate-limited per address and has no value.</p>
          <div className="actions">
            <button className="btn primary" disabled={state !== "idle"} onClick={request}>{state === "sending" ? "Requesting…" : state === "done" ? "Requested" : "Request testnet AETH"}</button>
          </div>
          {msg && <div className="hint" style={{ marginTop: 12 }}>{msg}</div>}
        </div>
      );
    }

    function Agents({ owner, perms, reload, onView }) {
      const [addr, setAddr] = useState("");
      const [limit, setLimit] = useState("");
      const [days, setDays] = useState("7");
      const [fees, setFees] = useState(true);
      const [feeLimit, setFeeLimit] = useState("1");
      const [only, setOnly] = useState("");
      const [busy, setBusy] = useState("");
      const [msg, setMsg] = useState(null);
      const addrOk = ADDR_RE.test(addr) && addr !== owner.address;
      const onlyList = only.split(/[\s,]+/).filter(Boolean);
      const onlyOk = onlyList.every((a) => ADDR_RE.test(a));
      const limitNum = parseFloat(limit) || 0, feeNum = parseFloat(feeLimit) || 0;
      const formOk = addrOk && limitNum > 0 && onlyOk && (!fees || feeNum > 0);

      function after(d, text) {
        if (!d.success) { setMsg({ ok: false, text: d.message || d.error || "the chain rejected it" }); return; }
        setMsg({ ok: true, text: text + " · tx " + d.tx_hash.slice(0, 16) + "…" });
        setTimeout(reload, 8000);
      }
      async function grant() {
        setBusy("grant"); setMsg(null);
        try {
          const body = { from: owner.name, grantee: addr, limit: Math.round(limitNum * 1e6).toString(), expiresAt: Math.floor(Date.now() / 1000) + Number(days) * 86400 };
          if (onlyList.length) body.allowList = onlyList;
          if (fees) body.feeLimit = Math.round(feeNum * 1e6).toString();
          const d = await api("/api/grants", body);
          after(d, "Granted. It shows here within a block");
          if (d.success) { setAddr(""); setLimit(""); setOnly(""); }
        } catch (e) { setMsg({ ok: false, text: e.message }); }
        setBusy("");
      }
      async function revoke(grantee) {
        if (!window.confirm("Revoke everything you've allowed " + grantee + " to do? It takes effect in the next block.")) return;
        setBusy(grantee); setMsg(null);
        try { after(await api("/api/grants/revoke", { from: owner.name, grantee }), "Revoked. It shows here within a block"); }
        catch (e) { setMsg({ ok: false, text: e.message }); }
        setBusy("");
      }
      return (
        <div className="col">
          <div className="card">
            <h2>Give an agent a spending allowance</h2>
            <p className="note">The agent can send up to the limit from <b>{owner.name}</b> until the date you pick. The chain enforces both, and you can revoke it any time. Granting the same agent again replaces its limit.</p>
            <label className="f">Agent address</label>
            <input className="field" value={addr} onChange={(e) => setAddr(e.target.value.trim())} placeholder="aether1…" />
            <div className={"hint " + (addr === "" ? "" : addrOk ? "ok" : "bad")}>{addr === "" ? "" : addrOk ? "✓ valid aether1 address" : addr === owner.address ? "✕ that's this account" : "✕ not an aether1 address"}</div>
            <div style={{ display: "flex", gap: 14 }}>
              <div style={{ flex: 1 }}><label className="f">Spend limit (AETH)</label><input className="field" value={limit} onChange={(e) => setLimit(e.target.value.replace(/[^0-9.]/g, ""))} placeholder="5" /></div>
              <div style={{ flex: 1 }}><label className="f">Expires in</label>
                <select className="field" value={days} onChange={(e) => setDays(e.target.value)}>
                  {[["1", "1 day"], ["7", "7 days"], ["30", "30 days"], ["90", "90 days"]].map(([v, t]) => <option key={v} value={v}>{t}</option>)}
                </select></div>
            </div>
            <label className="check"><input type="checkbox" checked={fees} onChange={(e) => setFees(e.target.checked)} />Also pay its transaction fees, up to</label>
            {fees && <input className="field" value={feeLimit} onChange={(e) => setFeeLimit(e.target.value.replace(/[^0-9.]/g, ""))} placeholder="1 AETH" />}
            <label className="f">Only let it pay these addresses (optional)</label>
            <textarea className="field" rows={2} value={only} onChange={(e) => setOnly(e.target.value)} placeholder="aether1… one per line; empty means anyone" />
            <div className={"hint" + (onlyOk ? "" : " bad")}>{onlyOk ? (onlyList.length ? onlyList.length + " address(es)" : "any recipient") : "✕ one of these isn't an aether1 address"}</div>
            <div className="actions"><button className="btn primary" disabled={!formOk || !!busy} onClick={grant}>{busy === "grant" ? "Signing with ML-DSA-44…" : "Sign & grant"}</button></div>
            {msg && <div className={"hint " + (msg.ok ? "ok" : "bad")} style={{ marginTop: 12, overflowWrap: "anywhere" }}>{msg.text}</div>}
          </div>
          <div className="card">
            <h2>Agents you've funded</h2>
            {!perms && <div className="empty">Loading…</div>}
            {perms && perms.error && <div className="hint bad">{perms.error}</div>}
            {perms && !perms.error && perms.given.length === 0 && <div className="empty">None yet.</div>}
            {perms && perms.given.map((p) => <Perm key={p.account} p={p} busy={busy === p.account} onRevoke={() => revoke(p.account)} onView={() => onView(p)} />)}
          </div>
          {perms && perms.received.length > 0 && (
            <div className="card">
              <h2>Allowances this account has received</h2>
              {perms.received.map((p) => <Perm key={p.account} p={p} received />)}
            </div>
          )}
        </div>
      );
    }

    function Perm({ p, received, busy, onRevoke, onView }) {
      const line = (k, v) => <div className="kv"><span>{k}</span><span style={{ overflowWrap: "anywhere", textAlign: "right" }}>{v}</span></div>;
      return (
        <div style={{ padding: "12px 0", borderTop: "1px solid var(--rule)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, justifyContent: "space-between" }}>
            <div className="mono" style={{ fontSize: 12.5, overflowWrap: "anywhere" }}>{(received ? "from " : "") + p.account}</div>
            {!received && <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>
              <button className="btn sm ghost" onClick={onView}>VIEW</button>
              <button className="btn sm danger" disabled={busy} onClick={onRevoke}>{busy ? "REVOKING…" : "REVOKE"}</button>
            </div>}
          </div>
          {p.send && line("May send", p.send.unlimited ? "anything (no limit)" : aeth(coinsU(p.send.spendLimit)) + " AETH more")}
          {p.send && line("To", p.send.allowList && p.send.allowList.length ? p.send.allowList.map(short).join(", ") : "anyone")}
          {p.send && line("Until", when(p.send.expiration))}
          {p.fees && line("Fees", "paid" + (p.fees.spendLimit && p.fees.spendLimit.length ? ", up to " + aeth(coinsU(p.fees.spendLimit)) + " AETH more" : ", no limit") + " · " + when(p.fees.expiration))}
          {!p.send && !p.fees && line("Other", (p.other || []).map((g) => g.kind).join(", "))}
        </div>
      );
    }

    function Settings({ update }) {
      const [info, setInfo] = useState(null);
      const [svc, setSvc] = useState(null);
      useEffect(() => {
        if (shellApp) shellApp.info().then(setInfo);
        api("/api/version").then(setSvc).catch(() => setSvc(null));
      }, []);
      const u = update || { state: shellApp ? "idle" : "unsupported" };
      const releases = (info && info.releasesUrl) || "https://github.com/whoyoujoshin/aether/releases";
      let status;
      if (!shellApp) status = <p className="note">This page is running outside the desktop app, so it can't update itself.</p>;
      else if (u.state === "unsupported") status = <p className="note">Updates install from inside the app only in the Windows app. On this computer, download new versions from the releases page.</p>;
      else if (u.state === "idle" || u.state === "checking") status = <p className="note">{u.state === "checking" ? "Checking for updates…" : "Not checked yet."}</p>;
      else if (u.state === "current") status = <p className="note"><span className="tag ok" style={{ marginLeft: 0, marginRight: 8 }}>UP TO DATE</span>checked {new Date(u.checkedAt).toLocaleTimeString()}</p>;
      else if (u.state === "available") status = (
        <p className="note"><span className="tag" style={{ marginLeft: 0, marginRight: 8 }}>UPDATE AVAILABLE</span>
          <b>{u.version}</b>{u.size ? " · installer " + mb(u.size) : ""}. It downloads only the parts that changed when it can, and your accounts stay as they are.</p>
      );
      else if (u.state === "downloading") status = (
        <div>
          <p className="note">Downloading {u.version}… {Math.floor(u.percent || 0)}%{u.total ? " · " + mb(u.transferred || 0) + " of " + mb(u.total) : ""}</p>
          <div className="bar"><i style={{ width: Math.max(2, u.percent || 0) + "%" }} /></div>
        </div>
      );
      else if (u.state === "ready") status = <p className="note"><span className="tag ok" style={{ marginLeft: 0, marginRight: 8 }}>READY</span><b>{u.version}</b> is downloaded. Restarting installs it and reopens Aether Pay.</p>;
      else status = <p className="note" style={{ color: "#ff9aac" }}>Couldn't update: {u.message}</p>;

      return (
        <div className="col">
          <div className="card">
            <h2>Aether Pay</h2>
            <div className="kv"><span>Version</span><span>{info ? info.version : shellApp ? "…" : "not the desktop app"}</span></div>
            <div style={{ marginTop: 10 }}>{status}</div>
            <div className="actions">
              {u.state === "available" && <button className="btn primary" onClick={() => shellApp.downloadUpdate()}>Update to {u.version}</button>}
              {u.state === "ready" && <button className="btn primary" onClick={() => shellApp.installUpdate()}>Restart to update</button>}
              {shellApp && ["idle", "current", "error"].includes(u.state) && <button className="btn" onClick={() => shellApp.checkForUpdates()}>{u.state === "error" ? "Try again" : "Check for updates"}</button>}
              <a className="btn" style={{ textAlign: "center" }} href={releases} target="_blank" rel="noreferrer">Release notes</a>
            </div>
          </div>
          <div className="card">
            <h2>Wallet service</h2>
            {!svc ? <div className="empty">Not answering.</div> : (
              <>
                <div className="kv"><span>Build</span><span>{svc.build}</span></div>
                <div className="kv"><span>Chain</span><span>{svc.chainId}</span></div>
                <div className="kv"><span>Node</span><span>{svc.grpc}</span></div>
                <div className="kv"><span>Keys folder</span><span style={{ overflowWrap: "anywhere", textAlign: "right" }}>{svc.keyringDir}</span></div>
              </>
            )}
            <p className="note" style={{ marginTop: 12 }}>Your keys stay in that folder on this computer; updating the app doesn't touch them.</p>
          </div>
        </div>
      );
    }

    // First run (or "+ Add an account"): this wallet holds only accounts
    // made here, recovered from their phrase, or picked from the CLI's
    // keyring on this computer -- never every key that happens to exist.
    function Setup({ canCancel, onCancel, onDone }) {
      const [legacy, setLegacy] = useState([]);
      const [mode, setMode] = useState("create");
      const [name, setName] = useState("wallet");
      const [phrase, setPhrase] = useState("");
      const [created, setCreated] = useState(null);
      const [saved, setSaved] = useState(false);
      const [busy, setBusy] = useState("");
      const [err, setErr] = useState("");
      useEffect(() => { api("/api/legacy-accounts").then(setLegacy).catch(() => setLegacy([])); }, []);
      const nameOk = /^[A-Za-z0-9_-]{1,32}$/.test(name);

      async function run(what, fn) {
        setBusy(what); setErr("");
        try { await fn(); } catch (e) { setErr(e.message); }
        setBusy("");
      }
      const create = () => run("create", async () => setCreated(await api("/api/accounts/create", { name })));
      const recover = () => run("recover", async () => onDone(await api("/api/accounts/recover", { name, mnemonic: phrase })));
      const bring = (n) => run(n, async () => onDone(await api("/api/accounts/bring-over", { name: n })));

      if (created) {
        const words = created.mnemonic.split(" ");
        return (
          <div className="setup"><div className="card">
            <h2>Write down your recovery phrase</h2>
            <div className="warn"><span>⚠</span><div>These {words.length} words are the only way to recover <b>{created.name}</b> if this computer is lost. Aether Pay won't show them again. Anyone who has them can spend from this account.</div></div>
            <div className="words">{words.map((w, i) => <div key={i}><i>{i + 1}</i>{w}</div>)}</div>
            <div className="addr" style={{ fontSize: 12 }}>{created.address}</div>
            <label className="check"><input type="checkbox" checked={saved} onChange={(e) => setSaved(e.target.checked)} />I've written them down somewhere safe</label>
            <div className="actions"><button className="btn primary" disabled={!saved} onClick={() => onDone(created)}>Open my wallet</button></div>
          </div></div>
        );
      }
      return (
        <div className="setup"><div className="card">
          <div className="brand" style={{ padding: "0 0 18px" }}><img src="aether-mark.svg" alt="" /><div><b>Aether Pay</b><small>TESTNET</small></div></div>
          <h2>{canCancel ? "Add an account" : "Set up your wallet"}</h2>
          <div className="tabs">
            <button className={mode === "create" ? "on" : ""} onClick={() => setMode("create")}>Create new</button>
            <button className={mode === "recover" ? "on" : ""} onClick={() => setMode("recover")}>Recover from phrase</button>
            {legacy.length > 0 && <button className={mode === "bring" ? "on" : ""} onClick={() => setMode("bring")}>Use one on this computer</button>}
          </div>
          {mode !== "bring" && <>
            <label className="f">Account name</label>
            <input className="field" value={name} onChange={(e) => setName(e.target.value.trim())} />
            <div className={"hint" + (nameOk ? "" : " bad")}>{nameOk ? "only you see this name" : "1-32 letters, digits, - or _"}</div>
          </>}
          {mode === "create" && <>
            <p className="note">Makes a new ML-DSA-44 key on this computer, backed up by a 24-word phrase you'll write down next.</p>
            <div className="actions"><button className="btn primary" disabled={!nameOk || !!busy} onClick={create}>{busy ? "Creating…" : "Create account"}</button></div>
          </>}
          {mode === "recover" && <>
            <label className="f">Recovery phrase</label>
            <textarea className="field" rows={3} value={phrase} onChange={(e) => setPhrase(e.target.value)} placeholder="the 24 words, separated by spaces" />
            <div className="actions"><button className="btn primary" disabled={!nameOk || phrase.trim().split(/\s+/).length < 12 || !!busy} onClick={recover}>{busy ? "Recovering…" : "Recover account"}</button></div>
          </>}
          {mode === "bring" && <>
            <p className="note">Keys the aetherd command-line tools keep on this computer. Pick yours; only that one is copied into Aether Pay, and the command-line tools keep theirs.</p>
            {legacy.map((a) => (
              <div className="row" key={a.name}>
                <span className="av">{initials(a.name)}</span>
                <div className="grow"><div className="nm">{a.name}</div><div className="ad">{a.address}</div></div>
                <button className="btn sm" disabled={!!busy} onClick={() => bring(a.name)}>{busy === a.name ? "…" : "USE THIS"}</button>
              </div>
            ))}
          </>}
          {err && <div className="banner" style={{ margin: "14px 0 0" }}>{err}</div>}
          {canCancel && <div style={{ marginTop: 18 }}><button className="link" onClick={onCancel}>← BACK TO WALLET</button></div>}
        </div></div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
