syntax = "proto3";
package aether.pow.v1;

import "gogoproto/gogo.proto";

option go_package = "github.com/whoyoujoshin/aether/x/pow";

service Query {
  rpc Difficulty(QueryDifficultyRequest) returns (QueryDifficultyResponse);
  rpc BlockReward(QueryBlockRewardRequest) returns (QueryBlockRewardResponse);
  rpc Escrow(QueryEscrowRequest) returns (QueryEscrowResponse);
  rpc BanStatus(QueryBanStatusRequest) returns (QueryBanStatusResponse);
  rpc ActiveValidators(QueryActiveValidatorsRequest) returns (QueryActiveValidatorsResponse);
  rpc CurrentEpoch(QueryCurrentEpochRequest) returns (QueryCurrentEpochResponse);
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);
}

message QueryDifficultyRequest {}
message QueryDifficultyResponse {
  string difficulty = 1;
}

message QueryBlockRewardRequest {}
message QueryBlockRewardResponse {
  string block_reward = 1;
}

message QueryEscrowRequest {
  string miner = 1;
}
message QueryEscrowResponse {
  string balance = 1;
  int64 unlock_height = 2;
  bool has_pending_escrow = 3;
}

message QueryBanStatusRequest {
  string miner = 1;
}
message QueryBanStatusResponse {
  bool banned = 1;
}

message QueryActiveValidatorsRequest {}
message QueryActiveValidatorsResponse {
  repeated string validators = 1;
}

message QueryCurrentEpochRequest {}
message QueryCurrentEpochResponse {
  int64 epoch = 1;
}

// QueryParamsResponse deliberately omits InitialDifficulty, BlockReward,
// and TailEmission from x/pow's genesis Params struct -- none of the
// three have any live keeper storage (no Get/Set beyond genesis
// init), so there is no "current value" to report beyond the
// already-superseded genesis default. Difficulty and BlockReward are
// both live, keeper-tracked values already exposed by their own
// dedicated queries (Difficulty, BlockReward) -- Difficulty is
// repeated here too for one-call convenience; BlockReward is not,
// since it now defaults to ComputeScheduledBlockReward's real decay
// curve rather than reading a static override in the normal case, and
// duplicating that nuance here risked being misread as a plain param.
message QueryParamsRequest {}
message QueryParamsResponse {
  int64 target_block_time = 1;
  string min_difficulty = 2;
  string max_difficulty = 3;
  string difficulty = 4;
  int64 epoch_length = 5;
  int64 top_k_size = 6;
  int64 bond_cooldown = 7;
  int64 recency_window_k = 8;
  int64 beacon_rounds_per_block = 9;
}