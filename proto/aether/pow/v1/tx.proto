syntax = "proto3";
package aether.pow.v1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "aether/pow/v1/auxpow.proto";

option go_package = "github.com/whoyoujoshin/aether/x/pow";

service Msg {
  rpc SubmitPoW(MsgSubmitPoW) returns (MsgSubmitPoWResponse);
  rpc RegisterValidatorPubkey(MsgRegisterValidatorPubkey) returns (MsgRegisterValidatorPubkeyResponse);
}

message MsgRegisterValidatorPubkey {
  option (cosmos.msg.v1.signer) = "miner";

  string miner = 1;
  bytes consensus_pubkey = 2; // raw 32-byte ed25519 public key
  bytes signature = 3;        // ed25519 signature, by the consensus private
                               // key, over the raw bytes of `miner` -- proves
                               // possession of the consensus private key
}

message MsgRegisterValidatorPubkeyResponse {}

message NativeSubmission {
  uint64 height      = 1;
  int64  timestamp   = 2;
  bytes  prev_hash   = 3;
  bytes  merkle_root = 4;
  uint64 nonce       = 5;
  uint64 difficulty  = 6;
}

message MsgSubmitPoW {
  option (cosmos.msg.v1.signer) = "miner";
  string miner = 1;

  oneof submission {
    NativeSubmission native = 2;
    AuxPowData aux_pow = 3;
  }
}

message MsgSubmitPoWResponse {}
