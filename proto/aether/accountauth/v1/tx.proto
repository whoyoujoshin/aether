syntax = "proto3";
package aether.accountauth.v1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "google/protobuf/any.proto";
import "aether/accountauth/v1/accountauth.proto";

option go_package = "github.com/whoyoujoshin/aether/x/accountauth";

service Msg {
  rpc RegisterAuthenticator(MsgRegisterAuthenticator) returns (MsgRegisterAuthenticatorResponse);
  rpc RevokeAuthenticator(MsgRevokeAuthenticator) returns (MsgRevokeAuthenticatorResponse);
  rpc ExecAuthenticated(MsgExecAuthenticated) returns (MsgExecAuthenticatedResponse);
  rpc RotateKey(MsgRotateKey) returns (MsgRotateKeyResponse);
  rpc CancelPendingRotation(MsgCancelPendingRotation) returns (MsgCancelPendingRotationResponse);
  rpc SetRecovery(MsgSetRecovery) returns (MsgSetRecoveryResponse);
  rpc RecoverKey(MsgRecoverKey) returns (MsgRecoverKeyResponse);
  rpc GuardianCancel(MsgGuardianCancel) returns (MsgGuardianCancelResponse);
  rpc GuardianSetRecovery(MsgGuardianSetRecovery) returns (MsgGuardianSetRecoveryResponse);
  rpc WatchtowerCancel(MsgWatchtowerCancel) returns (MsgWatchtowerCancelResponse);
}

// MsgRegisterAuthenticator is signed by the account's own primary
// (ML-DSA) key -- registering an authenticator never needs a new
// ante-handler path, since this is an ordinary signed message like any
// other.
message MsgRegisterAuthenticator {
  option (cosmos.msg.v1.signer) = "account";
  string account = 1;
  Authenticator authenticator = 2; // id is ignored on input; the keeper assigns it
}
message MsgRegisterAuthenticatorResponse {
  uint64 id = 1;
}

message MsgRevokeAuthenticator {
  option (cosmos.msg.v1.signer) = "account";
  string account = 1;
  uint64 id = 2;
}
message MsgRevokeAuthenticatorResponse {}

// MsgExecAuthenticated dispatches msgs as account, authorized either by
// signer being a registered session key (signer's own tx signature,
// already verified by the normal ante handler, is the proof) or by
// guardian_signatures meeting a registered guardian threshold (verified
// inside the handler itself, independent of who submits the tx).
message MsgExecAuthenticated {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1;  // whoever submits the tx: the session key itself, or anyone relaying guardian signatures
  string account = 2; // whose behalf the inner msgs execute on
  uint64 authenticator_id = 3;
  repeated google.protobuf.Any msgs = 4;
  repeated GuardianSignature guardian_signatures = 5; // only for a guardian_threshold authenticator
}
message MsgExecAuthenticatedResponse {
  repeated bytes results = 1;
}

// MsgRotateKey, signed by the account's current key, schedules its key
// to become new_pubkey RotationDelayBlocks later. new_key_signature is
// new_pubkey's signature over RotateKeySigningBytes (proof that whoever
// rotates holds the new key).
message MsgRotateKey {
  option (cosmos.msg.v1.signer) = "account";
  string account = 1;
  bytes new_pubkey = 2;
  bytes new_key_signature = 3;
}
message MsgRotateKeyResponse {
  int64 apply_height = 1;
}

// MsgCancelPendingRotation, signed by the account's current key, cancels
// its pending key change and pending recovery-set change.
message MsgCancelPendingRotation {
  option (cosmos.msg.v1.signer) = "account";
  string account = 1;
}
message MsgCancelPendingRotationResponse {}

// MsgSetRecovery, signed by the account's current key, schedules its
// recovery set to become (guardian_pubkeys, threshold,
// watchtower_pubkeys) RotationDelayBlocks later. No guardians and
// threshold 0 removes it, watchtowers too.
message MsgSetRecovery {
  option (cosmos.msg.v1.signer) = "account";
  string account = 1;
  repeated bytes guardian_pubkeys = 2;
  uint32 threshold = 3;
  repeated bytes watchtower_pubkeys = 4;
}
message MsgSetRecoveryResponse {
  int64 apply_height = 1;
}

// MsgRecoverKey makes new_pubkey the account's key at once, authorized
// by its recovery set: guardian_signatures over RecoverKeySigningBytes,
// at least the threshold of them, and new_key_signature over
// RotateKeySigningBytes at recovery_nonce. It clears any pending change.
// Anyone may submit it and pays the fee.
message MsgRecoverKey {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1;
  string account = 2;
  bytes new_pubkey = 3;
  bytes new_key_signature = 4;
  repeated GuardianSignature guardian_signatures = 5;
}
message MsgRecoverKeyResponse {}

// MsgGuardianCancel cancels the account's pending key change and pending
// recovery-set change, authorized by its recovery set's signatures over
// GuardianCancelSigningBytes. Anyone may submit it.
message MsgGuardianCancel {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1;
  string account = 2;
  repeated GuardianSignature guardian_signatures = 3;
}
message MsgGuardianCancelResponse {}

// MsgGuardianSetRecovery replaces the account's recovery set at once,
// authorized by the current set's signatures over
// GuardianSetRecoverySigningBytes (at least its threshold), at
// recovery_nonce. It drops a pending recovery-set change. This is how the
// guardians remove a watchtower: a watchtower can only cancel what the
// current key schedules, and this applies at once. Anyone may submit it.
message MsgGuardianSetRecovery {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1;
  string account = 2;
  repeated bytes guardian_pubkeys = 3;
  uint32 threshold = 4;
  repeated bytes watchtower_pubkeys = 5;
  repeated GuardianSignature guardian_signatures = 6;
}
message MsgGuardianSetRecoveryResponse {}

// MsgWatchtowerCancel cancels the account's pending key change and
// pending recovery-set change, both of which only the current key
// schedules, authorized by one of its watchtowers: signature over
// WatchtowerCancelSigningBytes at the account's nonce, which every
// current-key action advances, so a signature can't be replayed against
// a later change. Anyone may submit it.
message MsgWatchtowerCancel {
  option (cosmos.msg.v1.signer) = "submitter";
  string submitter = 1;
  string account = 2;
  bytes watchtower_pubkey = 3;
  bytes signature = 4;
}
message MsgWatchtowerCancelResponse {}

