syntax = "proto3";
package aether.accountauth.v1;

import "gogoproto/gogo.proto";

option go_package = "github.com/whoyoujoshin/aether/x/accountauth";

// SessionKey is a secondary ML-DSA-44 keypair an account has authorized
// to execute a bounded set of messages on its behalf -- expiring,
// capped to specific message types, and capped to a total lifetime
// uaeth spend. The account itself never signs with this key; it signs
// its OWN registration (MsgRegisterAuthenticator) with its primary key.
message SessionKey {
  bytes pubkey = 1;                      // raw ML-DSA-44 public key
  int64 expires_at_unix = 2;
  repeated string allowed_msg_types = 3; // Msg type URLs this key may execute; empty = none allowed
  string spend_limit_uaeth = 4;          // total this key may ever move, lifetime, across every MsgSend it executes
  string spent_uaeth = 5;                // running total already spent
}

// GuardianThreshold lets M of N registered ML-DSA-44 guardians jointly
// authorize a message on the account's behalf -- social recovery, or
// any multi-party spending policy -- without any guardian needing a
// funded account of their own: they only ever sign, and anyone may
// submit the resulting MsgExecAuthenticated.
message GuardianThreshold {
  repeated bytes guardian_pubkeys = 1;
  uint32 threshold = 2;
  uint64 next_sequence = 3; // replay protection: what the next accepted exec's signatures must cover, incremented on every accepted exec
}

// Authenticator is one alternate way to authorize actions on an
// account, registered by that account's own primary key.
message Authenticator {
  uint64 id = 1;
  oneof kind {
    SessionKey session_key = 2;
    GuardianThreshold guardian_threshold = 3;
  }
}

message GuardianSignature {
  bytes pubkey = 1;
  bytes signature = 2;
}

// Key rotation (docs/PQ-KEY-ROTATION.md): an account keeps its address
// while the ML-DSA-44 key that signs for it changes. A rotation by the
// current key, and any change to the recovery set, apply after
// RotationDelayBlocks; recovery guardians rotate at once, and can cancel
// a pending change. Every rotation signature covers a nonce (see
// RotationState).

// RecoverySet is M of N ML-DSA-44 guardians who may rotate the account's
// key at once and cancel pending changes. It is separate from a
// guardian_threshold authenticator, which can spend but never rotate.
message RecoverySet {
  repeated bytes guardian_pubkeys = 1;
  uint32 threshold = 2;
}

// PendingRotation is a key change scheduled by the current key.
message PendingRotation {
  bytes new_pubkey = 1;
  int64 apply_height = 2;
}

// PendingRecovery is a recovery-set change scheduled by the current key.
// An empty recovery removes the set.
message PendingRecovery {
  RecoverySet recovery = 1;
  int64 apply_height = 2;
}

// RotationState is one account's rotation record. It has two nonces so
// that the current key can't keep the guardians' signatures stale: nonce
// advances on the current key's own changes and covers MsgRotateKey's
// proof of possession; recovery_nonce advances only when the guardians
// act or the recovery set changes, and covers their signatures and
// MsgRecoverKey's proof of possession.
message RotationState {
  uint64 nonce = 1;
  RecoverySet recovery = 2;           // the active recovery set, if any
  PendingRotation pending_rotation = 3;
  PendingRecovery pending_recovery = 4;
  uint64 recovery_nonce = 5;
}

