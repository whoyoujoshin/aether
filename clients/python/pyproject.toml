[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-client"
version = "0.1.0"
description = "Python client for the Aether chain: ML-DSA-44 keys, payments, paid APIs (x402 aether-memo / aether-prepaid) and the service directory."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["dilithium-py>=1.4,<2", "mnemonic>=0.21"]

[tool.setuptools]
packages = ["aether_client"]
