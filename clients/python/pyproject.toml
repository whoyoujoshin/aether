[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-chain-client"
version = "0.1.0"
description = "Python client for the Aether chain: ML-DSA-44 keys, payments, buying and selling paid APIs (x402 aether-memo / aether-prepaid) and the service directory."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["dilithium-py>=1.4,<2", "mnemonic>=0.21"]
keywords = ["aether", "ai-agents", "agent-payments", "x402", "mcp", "blockchain", "cosmos", "post-quantum", "ml-dsa", "usdc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/whoyoujoshin/aether/tree/main/clients/python#readme"
Repository = "https://github.com/whoyoujoshin/aether"
Issues = "https://github.com/whoyoujoshin/aether/issues"

[tool.setuptools]
packages = ["aether_client"]
