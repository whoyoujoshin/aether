name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
          - goos: darwin
            goarch: amd64
            suffix: macos-intel
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -o dist/aetherd${{ matrix.ext }} ./cmd/aetherd
          go build -o dist/wallet${{ matrix.ext }} ./cmd/wallet
          go build -o dist/faucet${{ matrix.ext }} ./cmd/faucet
          go build -o dist/explorer${{ matrix.ext }} ./cmd/explorer
          go build -o dist/agentmcp${{ matrix.ext }} ./cmd/agentmcp
          go build -o dist/paywall${{ matrix.ext }} ./cmd/paywall
          go build -o dist/powminer${{ matrix.ext }} ./cmd/powminer

      - name: Package archive
        run: |
          cd dist
          tar -czf ../aether-${{ matrix.suffix }}.tar.gz *
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: aether-${{ matrix.suffix }}
          path: aether-${{ matrix.suffix }}.tar.gz

  mcpb:
    name: Build agentmcp MCPB bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Package bundle and registry server.json
        run: bash scripts/package-mcpb.sh "${{ github.ref_name }}" "${{ runner.temp }}/mcpb"

      - uses: actions/upload-artifact@v4
        with:
          name: aether-wallet-mcpb
          path: |
            ${{ runner.temp }}/mcpb/aether-wallet.mcpb
            ${{ runner.temp }}/mcpb/server.json

  desktop:
    name: Build desktop installer
    uses: ./.github/workflows/desktop.yml

  release:
    name: Publish release
    needs: [build, mcpb, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/aether-wallet.mcpb
            artifacts/server.json
            artifacts/Aether-Pay-Setup-*.exe
          body: |
            Pre-built Aether binaries for this release.

            **This project has not undergone a professional security audit.** Early-stage software -- do not use with real funds you cannot afford to lose entirely.

            Download the archive matching your platform, extract it, and run `aetherd` (or `aetherd.exe` on Windows). See the [README](https://github.com/whoyoujoshin/aether#public-testnet) for setup instructions and public testnet connection details.

            Includes: `aetherd` (the node), `wallet` (CLI wallet), `faucet` (testnet faucet service), `explorer` (block explorer dashboard), `agentmcp` (MCP wallet for AI agents: run `agentmcp init`), `paywall` (charge per request for an HTTP API) and `powminer` (native PoW miner).

            `Aether-Pay-Setup-*.exe` is the Aether Pay desktop wallet for Windows. It isn't code-signed yet, so Windows SmartScreen will warn on first run: choose "More info", then "Run anyway". It connects to the public testnet and keeps keys in `%USERPROFILE%\.aether` (unencrypted `test` keyring: testnet funds only).

            `aether-wallet.mcpb` is agentmcp as an MCP bundle for Windows, macOS and Linux: open it in Claude Desktop (or any client that installs MCPB bundles) to add the wallet. `server.json` is its MCP Registry entry.

            AI agents: see [AI agents: start here](https://github.com/whoyoujoshin/aether#ai-agents-start-here). With Go 1.25+, `go install github.com/whoyoujoshin/aether/cmd/agentmcp@latest` also works.
          draft: false
          prerelease: true

  registry:
    name: Publish to MCP Registry
    needs: [mcpb, release]
    runs-on: ubuntu-latest
    # Signs in to the registry as this repository's GitHub Actions run, which
    # may publish io.github.whoyoujoshin/* names; no stored token.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aether-wallet-mcpb
          path: mcpb

      - name: Install mcp-publisher 1.8.1
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Check the released bundle matches server.json
        run: |
          url=$(jq -r '.packages[0].identifier' mcpb/server.json)
          want=$(jq -r '.packages[0].fileSha256' mcpb/server.json)
          got=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          echo "$url: $got"
          test "$got" = "$want"

      - name: Publish
        working-directory: mcpb
        run: |
          ../mcp-publisher validate server.json
          ../mcp-publisher login github-oidc
          ../mcp-publisher publish
