name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: Test the shopper
        env:
          GOTOOLCHAIN: go1.26.10
        run: go test ./shopper/ ./cmd/shopper/
