name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: Test the explorer and agentmcp tool annotations
        env:
          GOTOOLCHAIN: go1.26.10
        run: |
          go test ./cmd/explorer/ -count=1 -timeout 20m
          go test ./cmd/agentmcp/ -count=1 -timeout 20m -run 'TestToolAnnotations'
      - name: Test the GPU kernel against Go's scrypt (pocl, an OpenCL driver for CPUs)
        env:
          GOTOOLCHAIN: go1.26.10
          CGO_ENABLED: "0"
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends pocl-opencl-icd
          go test ./gpu/ -count=1 -timeout 20m -v
