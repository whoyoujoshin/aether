[package]
name = "aether-swap"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "IBC-hooks swap-and-return contract for Aether on Osmosis testnet"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []
# Builds Osmosis from source. Too slow for CI; enable only for tests/swap.rs.
integration = ["dep:osmosis-test-tube"]

[dependencies]
cosmwasm-std = { version = "=2.1.4", features = ["stargate"] }
cosmwasm-schema = "=2.1.4"
cw-storage-plus = "2.0.0"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1"
bech32 = "0.11"
# Chain is osmosisd v31.0.0-rc1. The latest published bindings are 0.27.0
# (Osmosis ~v27). MsgSwapExactAmountIn in poolmanager v1beta1 is unchanged
# through v31, so 0.27.0 is the correct pin until a v31 crate is published.
osmosis-std = "=0.27.0"
# Optional so CI and the rules tests do not build Osmosis.
osmosis-test-tube = { version = "=27.0.1", optional = true }

[dev-dependencies]
cosmwasm-std = { version = "=2.1.4", features = ["stargate"] }
